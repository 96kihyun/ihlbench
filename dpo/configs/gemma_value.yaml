# LoRA DPO on Gemma-4-12B-it (single GPU).
# Override model_path with your local checkpoint.

output_dir: outputs/gemma-value
model_path: /path/to/gemma-4-12B-it
family: gemma
lora:
  rank: 8
  alpha: 16
  dropout: 0.0
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

dataset:
  train: dpo/data/train.jsonl
  val: dpo/data/holdout.jsonl
  max_seq_len: 2048

training:
  seed: 42
  epochs: 3
  max_steps: null
  batch_size: 1
  gradient_accumulation_steps: 8
  lr: 5.0e-5
  weight_decay: 0.05
  warmup_steps: 10
  max_grad_norm: 1.0
  beta: 0.1
  rpo_alpha: 1.0
  log_every_n_steps: 1
  val_every_n_steps: 18
  save_every_n_steps: null
  gradient_checkpointing: true

dtype: bf16
device: cuda
metric_log: outputs/metrics_gemma_value.jsonl
